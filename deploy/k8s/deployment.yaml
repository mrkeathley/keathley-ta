apiVersion: apps/v1
kind: Deployment
metadata:
  name: kta
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kta
  template:
    metadata:
      labels:
        app: kta
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: kta
          image: keathley-agentic-trader:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kta-config
            - secretRef:
                name: kta-secrets
          ports:
            - name: http
              containerPort: 8787
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kta-data
