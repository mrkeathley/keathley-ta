<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .nav-link:hover, .nav-link.active { color: #dff0d8; } /* Hover color for nav links */
        .list-group-item:hover, .page-link:hover { background-color: #dff0d8; color: #000; } /* Unified hover color */
        .active .page-link { background-color: #dff0d8; border-color: #dff0d8; color: #000; } /* Active page link color */
        .page-link { color: #000; } /* Page link color */
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
