[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "keathley-agentic-trader"
version = "0.1.0"
description = "A research-first, auditable agentic paper-trading experiment"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = {text = "UNLICENSED"}
authors = [{name = "Michael Keathley"}]
dependencies = []

[project.scripts]
kta = "kta.cli:main"

[tool.uv]
required-version = ">=0.12.6,<0.13"
package = true

[tool.uv.build-backend]
module-name = "kta"
module-root = "src"
